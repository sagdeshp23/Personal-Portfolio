# Netlify Configuration for Power Platform Portfolio

[build]
  publish = "."
  command = "# No build step needed - static site"

# Redirect rules
[[redirects]]
  from = "/portfolio.html"
  to = "/"
  status = 301
  force = false

# Cache settings for static assets
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.{js,css,png,jpg,jpeg,gif,svg,webp,woff,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Enable pretty URLs (remove .html extension)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
