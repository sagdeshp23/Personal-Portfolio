# Netlify Configuration for Power Platform Portfolio

[build]
  publish = "."
  command = "# No build step needed - static site"

# Redirect rules
[[redirects]]
  from = "/portfolio.html"
  to = "/"
  status = 301
  force = false

# No catch-all "/* -> /index.html" rewrite: this is a single page, and the rewrite
# turned every missing URL (broken images, /robots.txt typos) into a 200 homepage.

# Security headers + default cache for HTML and everything else
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS/JS are cache-busted with ?v=YYYYMMDD in index.html, so they can be cached for a year.
# (Netlify header paths support * splats, not {a,b} brace lists.)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images have no version query, so keep the cache short enough that replacements show up.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
